<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · NGO Donation Tracker"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="container" style="max-width:440px;padding-top:10vh"><div class="panel" style="padding:32px"><div class="eyebrow">SECURE ACCESS</div><h1 style="font-family:'Space Grotesk'">Administration Login</h1><p class="text-muted">Sign in to review donation requests.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ 'success' if category=='success' else 'danger' }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="POST"><div class="field"><label>Username</label><input name="username" required autocomplete="username"></div><div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div><button class="btn-primary wide" type="submit">Login</button></form><p class="small text-muted mt-3 mb-0">Demo username: admin</p></div></div></body></html>
